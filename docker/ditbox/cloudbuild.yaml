# Cloud Build config for publishing the ditbox tooling image.
#
# Usage:
#   make publish-ditbox          # tags :latest and :<short-sha>
#
# Or directly:
#   gcloud builds submit \
#       --config=docker/ditbox/cloudbuild.yaml \
#       --substitutions=_GIT_SHA=$(git rev-parse --short HEAD) \
#       .
#
# The build context is the repo root so the Dockerfile can `COPY requirements.txt`.
#
# Uses kaniko with a registry-backed layer cache (shared with the rest of the
# GFW org's GitHub-built images — see e.g. monitoring/cloudbuild/main.tf which
# uses the same _CACHE_REPO). Unchanged Dockerfile layers (apt packages,
# gcloud install, python base) get reused across rebuilds; only the bottom
# of the file rebuilds on dep bumps.

substitutions:
  # dit images live under gcr.io/world-fishing-827/dit/* (see docs/conventions.md
  # and CLAUDE.md § Working agreements). Same-project as Dataflow workers;
  # only needs uploadArtifacts on world-fishing-827 (project-level), no
  # repositories.create.
  _IMAGE: gcr.io/world-fishing-827/dit/ditbox
  _GIT_SHA: dev
  # Shared org-wide kaniko cache repo. We have project-level uploadArtifacts
  # on world-fishing-827, so writes here work without a per-repo grant.
  _CACHE_REPO: gcr.io/world-fishing-827/github.com/globalfishingwatch/kaniko-cache

steps:
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_IMAGE}:latest
      - --destination=${_IMAGE}:${_GIT_SHA}
      - --cache=true
      - --cache-ttl=8760h
      - --cache-repo=${_CACHE_REPO}
      - --dockerfile=docker/ditbox/Dockerfile
      - --context=dir:///workspace
      - --log-format=text

# kaniko pushes via its --destination flags; no `images:` field needed
# (that's for the docker builder and would cause a redundant push attempt).

options:
  logging: CLOUD_LOGGING_ONLY
