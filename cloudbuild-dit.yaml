# Cloud Build config for ad-hoc and PR-triggered runs of dit workflows.
#
# This is the canonical "how to run dit" yaml. Per the architecture decision
# in docs/plan.md § Runtime & CI, pipeline repos own their own triggers
# (which reference this yaml's content), while dit owns the yaml itself.
#
# Ad-hoc usage from a laptop:
#   make dit-cloud \
#       PIPELINE=anchorages_pipeline \
#       WORKFLOW=workflows/port_visits/ais.py \
#       ARGS="--runner dataflow --parallel --build-from-source"
#
# Or directly:
#   gcloud builds submit \
#       --config=cloudbuild-dit.yaml \
#       --source=$PROJECTS/anchorages_pipeline \
#       --substitutions=_WORKFLOW=workflows/port_visits/ais.py,_PIPELINE=anchorages_pipeline,_ARGS="..."
#
# The build context (--source) is the PIPELINE checkout. dit itself is
# cloned fresh from GitHub at _DIT_REF (default main).

substitutions:
  # Required:
  _WORKFLOW: ''       # workflow path inside the dit checkout, e.g. workflows/port_visits/ais.py
  _PIPELINE: ''       # pipeline name: pipe-gaps | anchorages_pipeline | pipe-events
  # Optional:
  _ARGS: ''           # args appended to `dit run <workflow>`
  _REF: ''            # pipeline ref to install; empty -> editable install from the source upload
  _DIT_REF: main      # dit ref to clone
  # The submission-side apache-beam version must match the published Dataflow
  # worker image's beam version; otherwise workers fail with "Pipeline
  # construction environment and pipeline runtime environment are not
  # compatible". The right value depends on which worker image the workflow
  # uses (pipe-gaps:v0.9.6 -> 2.71.0; pipe-anchorages:v4.6.4 -> 2.69.0). When
  # non-empty, this is passed to uv as a --constraint so any fresh resolution
  # is held to the right version; empty disables the constraint.
  _BEAM_VERSION: ''

steps:
  - id: dit-run
    # ditbox lives under gcr.io/world-fishing-827/dit/* per the dit-image
    # convention (see docs/conventions.md and CLAUDE.md § Working agreements).
    name: gcr.io/world-fishing-827/dit/ditbox:latest
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        echo ">>> Cloning dit @ ${_DIT_REF}"
        git clone --depth=1 --branch="${_DIT_REF}" \
            https://github.com/GlobalFishingWatch/data-integration-tests.git \
            /workspace/.dit

        # uv is baked into ditbox (~10x faster than pip for the per-run
        # pipeline install where transitive deps dominate). --system installs
        # into ditbox's system Python rather than requiring a venv.
        echo ">>> Installing dit (editable from /workspace/.dit)"
        uv pip install --system --no-deps -e /workspace/.dit

        # When _BEAM_VERSION is set, write a constraint file so the pipeline
        # install below honours it. Otherwise uv freely picks the newest
        # apache-beam matching the pipeline's ~= constraint, which drifts
        # past whatever the published worker image was built with.
        CONSTRAINT_FLAGS=()
        if [ -n "${_BEAM_VERSION}" ]; then
            echo "apache-beam==${_BEAM_VERSION}" > /tmp/dit-constraints.txt
            CONSTRAINT_FLAGS+=(--constraint /tmp/dit-constraints.txt)
            echo ">>> Pinning apache-beam==${_BEAM_VERSION} via uv --constraint"
        fi

        # --no-deps is deliberately NOT used in either branch: pipelines like
        # pipe-gaps need apache-beam (and dozens of transitives) on the
        # submission side too, since the Dataflow runner is in-process here.
        # The _BEAM_VERSION constraint (when set) holds beam to the version
        # baked into the published worker image; everything else resolves
        # freely.
        if [ -n "${_REF}" ]; then
            echo ">>> Installing ${_PIPELINE} @ ${_REF} (non-editable)"
            uv pip install --system --reinstall \
                "${CONSTRAINT_FLAGS[@]}" \
                "git+file:///workspace@${_REF}"
        else
            echo ">>> Installing ${_PIPELINE} from /workspace (editable, from source upload)"
            uv pip install --system "${CONSTRAINT_FLAGS[@]}" -e /workspace
        fi

        echo ">>> Running: dit run ${_WORKFLOW} ${_ARGS}"
        cd /workspace
        exec dit run "/workspace/.dit/${_WORKFLOW}" ${_ARGS}

timeout: 86400s

serviceAccount: projects/world-fishing-827/serviceAccounts/automated-testing@world-fishing-827.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
